name: WAVLIB stability repair

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/wavlib-stability.yml'

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[wavlib-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove account/auth code and personal email; keep Supabase Storage
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          text_exts = {'.html', '.js', '.css', '.json', '.md', '.txt'}
          personal_email = 'zahwanziad.123@gmail.com'
          support_email = 'wavlib.support@gmail.com'

          # Work on the full source files so account code is removed without damaging unrelated lines.
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text

              # Remove the personal/account email from website source. Support email is untouched.
              text = text.replace(personal_email, '')

              # Remove Supabase Auth API usage only. Keep Supabase itself and all supabase.storage code.
              text = re.sub(r'^.*\bsupabase\.auth\.[^;\n]*;?.*$', '', text, flags=re.I | re.M)
              text = re.sub(r'^.*\b(?:signInWithPassword|signUp|signOut|getSession|onAuthStateChange)\s*\([^;\n]*\)\s*;?.*$', '', text, flags=re.I | re.M)

              # Remove known account/auth helper functions from the legacy page script.
              for name in ('showAuthRedirectError', 'toggleAccountMenu', 'applySupabaseUser', 'registerAccount'):
                  text = re.sub(
                      r'\n\s*(?:async\s+)?function\s+' + re.escape(name) + r'\s*\([^)]*\)\s*\{.*?\n\s*\}\s*',
                      '\n', text, flags=re.S
                  )

              # Remove account/login/signup UI controls only.
              text = re.sub(r'\s*<button[^>]*(?:class|id|aria-label|title)=["\'][^"\']*(?:sign[- ]?in|log[- ]?in|sign[- ]?up|account|register)[^"\']*["\'][^>]*>.*?</button>\s*', '\n', text, flags=re.I | re.S)
              text = re.sub(r'\s*<a[^>]*(?:class|id|aria-label|title|href)=["\'][^"\']*(?:sign[- ]?in|log[- ]?in|sign[- ]?up|account|register|auth)[^"\']*["\'][^>]*>.*?</a>\s*', '\n', text, flags=re.I | re.S)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print('cleaned', path)

          # Harden every search/input field against browser/password-manager account autofill.
          ui = root / 'js' / 'ui.js'
          if ui.exists():
              text = ui.read_text(encoding='utf-8')
              text = text.replace("input.setAttribute('autocomplete', 'off');", "input.setAttribute('autocomplete', 'new-password');")
              if 'function setupGlobalEmailRemoval()' not in text:
                  marker = '  function boot() {'
                  fn = '''  function setupGlobalEmailRemoval() {\n    const emailPattern = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;\n    const clean = () => {\n      document.querySelectorAll('input, textarea').forEach((input) => {\n        input.setAttribute('autocomplete', 'new-password');\n        input.setAttribute('autocorrect', 'off');\n        input.setAttribute('autocapitalize', 'off');\n        input.setAttribute('spellcheck', 'false');\n        input.setAttribute('data-form-type', 'other');\n        input.setAttribute('data-lpignore', 'true');\n        input.setAttribute('data-1p-ignore', 'true');\n        const value = String(input.value || '').trim();\n        if (emailPattern.test(value)) {\n          input.value = '';\n          input.removeAttribute('value');\n          input.dispatchEvent(new Event('input', { bubbles: true }));\n          input.dispatchEvent(new Event('change', { bubbles: true }));\n        }\n      });\n    };\n    clean();\n    document.addEventListener('input', clean, true);\n    document.addEventListener('change', clean, true);\n    document.addEventListener('focusin', clean, true);\n    window.addEventListener('pageshow', clean, { passive: true });\n    [0,100,250,500,1000,2000,4000,8000].forEach((n) => window.setTimeout(clean, n));\n    window.setInterval(clean, 300);\n  }\n\n'''
                  text = text.replace(marker, fn + marker, 1)
                  text = text.replace('    setupTopSearch();', '    setupGlobalEmailRemoval();\n    setupTopSearch();', 1)
              ui.write_text(text, encoding='utf-8')

          # Bust the old cached JS so the browser receives the cleanup immediately.
          index = root / 'index.html'
          if index.exists():
              text = index.read_text(encoding='utf-8')
              text = re.sub(r'src="js/ui\\.js(?:\\?[^\"]*)?"', 'src="js/ui.js?v=20260826-6"', text, count=1)
              index.write_text(text, encoding='utf-8')

          # Keep Supabase Storage code intact. Only report non-support email literals for verification.
          email_re = re.compile(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}')
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              bad = [m for m in email_re.findall(text) if m.lower() != support_email.lower()]
              if bad:
                  print('NON_SUPPORT_EMAIL', path, bad)

          Path('.nojekyll').touch()

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Remove account auth and personal email [wavlib-auto]"
          git push
