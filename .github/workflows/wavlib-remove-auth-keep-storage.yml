name: WAVLIB remove auth keep storage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wavlib-remove-auth-keep-storage.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[wavlib-auth-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove account auth and personal email, preserve Supabase Storage
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          text_exts = {'.html', '.js', '.css', '.json', '.md', '.txt', '.yml', '.yaml'}
          personal_email = 'zahwanziad.123@gmail.com'
          support_email = 'wavlib.support@gmail.com'

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text

              # Remove the personal/account email everywhere. Keep the support address only.
              text = text.replace(personal_email, '')

              # Remove Supabase Auth CDN/bootstrap code; do not remove supabase.storage usage.
              text = re.sub(r'<script[^>]+src=["\']https://cdn\.jsdelivr\.net/npm/@supabase/supabase-js@[^"\']+["\'][^>]*></script>\s*', '', text, flags=re.I)
              text = re.sub(r'<script[^>]*>\s*/\*\s*Supabase connection\s*\*/.*?</script>\s*', '', text, flags=re.I | re.S)

              # Remove complete obvious auth function blocks where the source has them as named functions.
              for name in ('showAuthRedirectError', 'toggleAccountMenu', 'applySupabaseUser'):
                  text = re.sub(r'\n\s*(?:async\s+)?function\s+' + re.escape(name) + r'\s*\([^)]*\)\s*\{.*?\n\s*\}\s*', '\n', text, flags=re.S)

              # Remove individual auth API calls without touching storage.
              text = re.sub(r'^.*\bsupabase\.auth\.[^;\n]*;?.*$', '', text, flags=re.I | re.M)
              text = re.sub(r'^.*\b(?:signIn|signUp|signOut|onAuthStateChange|getSession)\s*\([^;\n]*\)\s*;?.*$', '', text, flags=re.I | re.M)

              # Remove account/login/signup controls from HTML. Legal links are not account controls.
              text = re.sub(r'\s*<button[^>]*(?:class|id|aria-label|title)=["\'][^"\']*(?:sign[- ]?in|log[- ]?in|sign[- ]?up|account|register)[^"\']*["\'][^>]*>.*?</button>\s*', '\n', text, flags=re.I | re.S)
              text = re.sub(r'\s*<a[^>]*(?:class|id|aria-label|title|href)=["\'][^"\']*(?:sign[- ]?in|log[- ]?in|sign[- ]?up|account|register|auth)[^"\']*["\'][^>]*>.*?</a>\s*', '\n', text, flags=re.I | re.S)

              # Make every search/input field resistant to browser account autofill.
              if path.name == 'ui.js':
                  text = text.replace("input.setAttribute('autocomplete', 'off');", "input.setAttribute('autocomplete', 'new-password');", 2)
                  if 'function setupGlobalEmailRemoval()' not in text:
                      marker = '  function boot() {'
                      fn = '''  function setupGlobalEmailRemoval() {\n    const emailPattern = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;\n    const clean = () => {\n      document.querySelectorAll('input, textarea').forEach((input) => {\n        input.setAttribute('autocomplete', 'new-password');\n        input.setAttribute('data-form-type', 'other');\n        input.setAttribute('data-lpignore', 'true');\n        input.setAttribute('data-1p-ignore', 'true');\n        const value = String(input.value || '').trim();\n        if (emailPattern.test(value)) {\n          input.value = '';\n          input.removeAttribute('value');\n          input.dispatchEvent(new Event('input', { bubbles: true }));\n        }\n      });\n    };\n    clean();\n    document.addEventListener('input', clean, true);\n    document.addEventListener('change', clean, true);\n    document.addEventListener('focusin', clean, true);\n    window.addEventListener('pageshow', clean, { passive: true });\n    [0, 100, 250, 500, 1000, 2000, 4000, 8000].forEach((delay) => window.setTimeout(clean, delay));\n    window.setInterval(clean, 300);\n  }\n\n'''
                      text = text.replace(marker, fn + marker, 1)
                      text = text.replace('    setupTopSearch();', '    setupGlobalEmailRemoval();\n    setupTopSearch();', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print('changed', path)

          # Bump the JS URL so the browser cannot keep the previous cached cleaner.
          index = root / 'index.html'
          if index.exists():
              text = index.read_text(encoding='utf-8')
              text = text.replace('js/ui.js?v=20260826-4', 'js/ui.js?v=20260826-5')
              index.write_text(text, encoding='utf-8')

          # Report any email literal other than the support address.
          email_re = re.compile(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}')
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              bad = [m for m in email_re.findall(text) if m.lower() != support_email.lower()]
              if bad:
                  print('NON_SUPPORT_EMAIL', path, bad)

      - name: Commit cleanup and remove this one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm .github/workflows/wavlib-remove-auth-keep-storage.yml
          git commit -m '[wavlib-auth-cleanup] remove account auth and personal email'
          git push
