name: Apply mobile UI runtime loader

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load mobile drawer script and clean up
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          marker = '<script src="js/ui.js"></script>'

          if marker not in text:
              needle = '</body>'
              if needle not in text:
                  raise SystemExit('Could not find </body> in index.html')
              text = text.replace(needle, f'{marker}\n{needle}', 1)
              index.write_text(text, encoding='utf-8')

          # This one-shot workflow removes itself after applying the patch.
          workflow = Path('.github/workflows/mobile-ui-patch.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit mobile UI loader
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/mobile-ui-patch.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Load mobile navigation drawer"
          git push
