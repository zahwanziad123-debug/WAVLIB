name: WAVLIB stability repair

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/wavlib-stability.yml'

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[wavlib-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply deep runtime stability fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Make fonts non-blocking and bust stale browser caches for local assets.
          s = s.replace(
              '<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">',
              '<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media=\'all\'">'
          )
          s = re.sub(r'href="css/animations\.css(?:\?[^\"]*)?"', 'href="css/animations.css?v=20260826-4"', s, count=1)
          s = re.sub(r'src="js/ui\.js(?:\?[^\"]*)?"', 'src="js/ui.js?v=20260826-4"', s, count=1)

          # Remove the synchronous Supabase CDN dependency. Auth is hidden, so it must never
          # be able to prevent the sample library from booting when a third-party CDN is slow.
          supabase_pattern = r'<script src="https://cdn\.jsdelivr\.net/npm/@supabase/supabase-js@2"></script>\s*<script>\s*/\* Supabase connection \*/.*?</script>'
          supabase_stub = '''<script>\n/* WAVLIB authentication is disabled. Local compatibility only; no network dependency. */\nconst wavlibSupabase = {\n  auth: {\n    getSession: async () => ({ data: { session: null } }),\n    onAuthStateChange: () => ({ data: { subscription: { unsubscribe() {} } } }),\n    signInWithPassword: async () => ({ data: { user: null }, error: { message: 'Authentication is disabled.' } }),\n    signUp: async () => ({ data: { user: null, session: null }, error: { message: 'Authentication is disabled.' } }),\n    signOut: async () => ({ error: null })\n  }\n};\n</script>'''
          s = re.sub(supabase_pattern, supabase_stub, s, count=1, flags=re.S)

          # Remove the auth session boot section without depending on fragile nested parentheses.
          s = re.sub(
              r'\s*showAuthRedirectError\(\);.*?\n\s*function toggleAccountMenu\(\)',
              '\napplySupabaseUser(null);\n\nfunction toggleAccountMenu()',
              s,
              count=1,
              flags=re.S
          )

          # Hard-disable any legacy splash overlay and reduce paint cost for large lists.
          if 'id="wavlib-stability-overrides"' not in s:
              override = '''<style id="wavlib-stability-overrides">\n  body::before, body::after { display:none !important; content:none !important; animation:none !important; }\n  .pack-card, .track-row { contain: layout paint style; }\n  .pack-row, .pack-grid, .track-list { contain: layout paint; }\n  @media (prefers-reduced-motion: reduce) { * { animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }\n</style>\n'''
              s = s.replace('</head>', override + '</head>', 1)

          p.write_text(s, encoding='utf-8')
          Path('.nojekyll').write_text('', encoding='utf-8')

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll
          git diff --cached --quiet && exit 0
          git commit -m "Deep WAVLIB stability repair [wavlib-auto]"
          git push
